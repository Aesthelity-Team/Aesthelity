name: DATA-01 dataset checks

on:
  pull_request:
    paths:
      - 'Aesthelity/Aesthelity/Resources/DemoData/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/PROVENANCE.md'
      - '.github/workflows/data01.yml'
  push:
    branches: [main]
    paths:
      - 'Aesthelity/Aesthelity/Resources/DemoData/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/PROVENANCE.md'
      - '.github/workflows/data01.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/demo_catalog.py
      - run: python -m unittest discover -s tests -v
