name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Aesthelity/Aesthelity.xcodeproj
  SCHEME: Aesthelity
  XCODE_APP: /Applications/Xcode_27.0.app

jobs:
  build:
    name: Build app
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      - name: Build app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -resultBundlePath BuildResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed build results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuildResults
          path: BuildResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
