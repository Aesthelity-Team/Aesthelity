name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Aesthelity/Aesthelity.xcodeproj
  SCHEME: Aesthelity
  XCODE_APP: /Applications/Xcode_27.0.app

jobs:
  unit-tests:
    name: Build and unit test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator is available on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:AesthelityTests \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
